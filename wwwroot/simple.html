<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能客服 - 简化版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.assistant {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .execution-process {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .execution-process h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .execution-process pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .query-result {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }

        .query-result table {
            width: 100%;
            border-collapse: collapse;
        }

        .query-result th,
        .query-result td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .query-result th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .input-area {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI智能客服 - 简化版</h1>
            <p style="margin-top: 8px; opacity: 0.9;">准确执行 · 直接回答</p>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message assistant">
                <div class="message-content">
                    您好！我是AI智能客服，可以帮您查询系统数据和回答问题。请问有什么可以帮助您的？
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text"
                       class="input-field"
                       id="messageInput"
                       placeholder="请输入您的问题..."
                       autofocus>
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    发送
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let conversationId = '';
        let isProcessing = false;

        // 监听回车键发送消息
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || isProcessing) return;

            isProcessing = true;
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            sendButton.innerHTML = '<div class="loading"></div>';

            // 添加用户消息
            addMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch('/api/simplechat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        conversationId: conversationId,
                        message: message
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.conversationId) {
                    conversationId = data.conversationId;
                }

                // 显示助手响应
                displayAssistantResponse(data);

            } catch (error) {
                console.error('Error:', error);
                addMessage('抱歉，发送消息时出现错误：' + error.message, 'assistant');
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                sendButton.textContent = '发送';
            }
        }

        function displayAssistantResponse(data) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            let content = '<div class="message-content">';

            // 显示执行过程（如果有）
            if (data.executionProcess) {
                content += '<div class="execution-process">';
                content += '<h4>执行过程</h4>';
                content += marked.parse(data.executionProcess);
                content += '</div>';
            }

            // 显示查询结果（如果有）
            if (data.queryResult) {
                content += '<div class="query-result">';
                content += '<h4>查询结果</h4>';
                content += formatQueryResult(data.queryResult);
                content += '</div>';
            }

            // 显示答案
            if (data.answer) {
                content += '<div style="margin-top: 10px;">';
                content += '<strong>回答：</strong><br>';
                content += marked.parse(data.answer);
                content += '</div>';
            }

            content += '</div>';
            messageDiv.innerHTML = content;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function formatQueryResult(queryResult) {
            // 将Markdown表格转换为HTML表格
            if (queryResult.includes('|')) {
                const lines = queryResult.split('\n');
                let html = '<table>';
                let isHeader = true;

                for (const line of lines) {
                    if (line.trim() === '' || line.includes('---')) continue;

                    const cells = line.split('|')
                        .map(cell => cell.trim())
                        .filter(cell => cell !== '');

                    if (cells.length > 0) {
                        html += '<tr>';
                        const tag = isHeader ? 'th' : 'td';
                        for (const cell of cells) {
                            html += `<${tag}>${cell}</${tag}>`;
                        }
                        html += '</tr>';
                        if (isHeader) isHeader = false;
                    }
                }

                html += '</table>';
                return html;
            }

            return `<pre>${queryResult}</pre>`;
        }

        function addMessage(text, role) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${marked.parse(text)}</div>`;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 页面加载时创建新会话
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/simplechat/new-conversation', {
                    method: 'POST'
                });
                const data = await response.json();
                conversationId = data.conversationId;
                console.log('新会话已创建:', conversationId);
            } catch (error) {
                console.error('创建会话失败:', error);
            }
        });
    </script>
</body>
</html>
