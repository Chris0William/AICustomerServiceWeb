<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能客服 - 内部测试版</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>AI智能客服</h2>
                <button id="newConversationBtn" class="btn-primary">+ 新建会话</button>
            </div>
            <div class="conversation-list" id="conversationList">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="chat-header">
                <div class="chat-title" id="chatTitle">请选择或创建会话</div>
                <div class="chat-info">
                    <span id="modelInfo"></span>
                    <span id="tokenInfo" class="token-badge"></span>
                    <button id="exportBtn" class="btn-secondary" style="display:none;">导出对话</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h3>👋 欢迎使用AI智能客服测试系统</h3>
                    <p>这是一个内部测试版本，用于评估AI模型能力和上下文处理极限。</p>
                    <p>功能特性：</p>
                    <ul>
                        <li>✅ 数据库查询（Text2SQL）</li>
                        <li>✅ 知识库检索（RAGFlow）</li>
                        <li>✅ 多轮对话上下文理解</li>
                        <li>✅ 自动工具选择</li>
                    </ul>
                    <p>请点击左上角"新建会话"开始测试。</p>
                </div>
            </div>

            <div class="chat-input-container">
                <textarea
                    id="userInput"
                    placeholder="输入您的问题...（Shift+Enter换行，Enter发送）"
                    rows="1"
                    disabled></textarea>
                <button id="sendBtn" class="btn-send" disabled>发送</button>
            </div>
        </div>
    </div>

    <div id="modelModal" class="modal">
        <div class="modal-content">
            <h3>选择模型</h3>
            <div id="modelOptions" class="model-options">
                <div class="loading">加载模型列表...</div>
            </div>
            <div class="modal-actions">
                <button id="cancelModelBtn" class="btn-secondary">取消</button>
                <button id="confirmModelBtn" class="btn-primary" disabled>确认</button>
            </div>
        </div>
    </div>

    <!-- 任务日志详情弹窗 -->
    <div id="logModal" class="log-modal">
        <div class="log-modal-content">
            <div class="log-modal-header">
                <h3>🔍 任务执行详情</h3>
                <button class="log-modal-close" onclick="closeLogModal()">&times;</button>
            </div>
            <div class="log-modal-body" id="logModalBody">
                <div class="loading-logs">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
